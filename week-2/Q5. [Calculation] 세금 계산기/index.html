<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세금계산서 생성기</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<!-- ⚠️ 모든 CDN은 버전을 명시적으로 고정한다. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
<style>
  body { background: #f3f4f6; }
  @media print {
    @page {
      size: A4 landscape;
      margin: 12mm;
    }
    .no-print { display: none !important; }
    body { background: #ffffff; }
    .print-area {
      box-shadow: none !important;
      margin: 0 !important;
      width: 100% !important;
      font-size: 13px;
    }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;

// ========================================
// 🧩 ID / 날짜 유틸리티
// ========================================

let idCounter = 0;
function makeId() {
  idCounter += 1;
  return `id-${idCounter}`;
}

function todayParts() {
  const d = new Date();
  return { year: d.getFullYear(), month: d.getMonth() + 1, day: d.getDate() };
}

function formatWon(n) {
  return `${Number(n || 0).toLocaleString("ko-KR")}원`;
}

// ========================================
// 🎨 Design System Components
// ========================================

function Button({ variant = "primary", size = "md", disabled, onClick, className = "", children, type = "button" }) {
  const base = "inline-flex items-center justify-center gap-2 rounded-lg font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed";
  const variants = {
    primary: "bg-blue-700 text-white hover:bg-blue-800 focus:ring-blue-400",
    secondary: "bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 focus:ring-gray-300",
    ghost: "bg-transparent text-gray-500 hover:bg-gray-100 focus:ring-gray-200",
  };
  const sizes = {
    sm: "px-3 py-1.5 text-sm",
    md: "px-4 py-2.5 text-sm",
    lg: "px-6 py-3 text-base",
  };
  return (
    <button
      type={type}
      disabled={disabled}
      onClick={onClick}
      className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
    >
      {children}
    </button>
  );
}

function Input({ label, value, onChange, placeholder, className = "" }) {
  return (
    <label className={`block ${className}`}>
      {label && <span className="mb-1 block text-xs font-medium text-gray-600">{label}</span>}
      <input
        type="text"
        value={value}
        onChange={onChange}
        placeholder={placeholder}
        className="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-300"
      />
    </label>
  );
}

function NumberInput({ value, onChange, placeholder, className = "" }) {
  const display = value === "" || value === null || value === undefined ? "" : Number(value).toLocaleString("ko-KR");
  const handleChange = (e) => {
    const digits = e.target.value.replace(/[^0-9]/g, "");
    onChange(digits === "" ? "" : Number(digits));
  };
  return (
    <input
      type="text"
      inputMode="numeric"
      value={display}
      onChange={handleChange}
      placeholder={placeholder}
      className={`w-full rounded-lg border border-gray-300 px-2 py-1.5 text-right text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-300 ${className}`}
    />
  );
}

function Card({ className = "", children }) {
  return (
    <div className={`rounded-2xl bg-white p-5 shadow-sm ring-1 ring-gray-100 ${className}`}>
      {children}
    </div>
  );
}

// ========================================
// 🧩 공급자/공급받는자 정보 입력 블록
// ========================================

function PartyEditor({ title, party, onChange, disabledFields = [] }) {
  const set = (field) => (e) => onChange({ ...party, [field]: e.target.value });
  return (
    <div>
      <h3 className="mb-3 text-sm font-semibold text-gray-700">{title}</h3>
      <div className="grid grid-cols-2 gap-3">
        <Input label="등록번호" value={party.regNo} onChange={set("regNo")} placeholder="000-00-00000" className="col-span-2" />
        <Input label="상호(법인명)" value={party.name} onChange={set("name")} placeholder="상호" />
        <Input label="성명(대표자)" value={party.ceo} onChange={set("ceo")} placeholder="성명" />
        <Input label="사업장 주소" value={party.address} onChange={set("address")} placeholder="주소" className="col-span-2" />
        <Input label="업태" value={party.bizType} onChange={set("bizType")} placeholder="업태" />
        <Input label="종목" value={party.bizItem} onChange={set("bizItem")} placeholder="종목" />
      </div>
    </div>
  );
}

// ========================================
// 📄 입력 폼 (왼쪽)
// ========================================

function InvoiceForm({ state, setState }) {
  const { supplier, buyer, docDate, items, payment } = state;

  const updateItem = (id, patch) => setState((s) => ({ ...s, items: s.items.map((it) => (it.id === id ? { ...it, ...patch } : it)) }));
  const addItem = () =>
    setState((s) => ({
      ...s,
      items: [...s.items, { id: makeId(), month: docDate.month, day: docDate.day, name: "", spec: "", qty: 1, unitPrice: "", note: "" }],
    }));
  const removeItem = (id) => setState((s) => ({ ...s, items: s.items.length > 1 ? s.items.filter((it) => it.id !== id) : s.items }));

  return (
    <div className="space-y-6 no-print">
      <Card>
        <PartyEditor title="① 공급자 정보" party={supplier} onChange={(supplier) => setState((s) => ({ ...s, supplier }))} />
      </Card>

      <Card>
        <PartyEditor title="② 공급받는자 정보" party={buyer} onChange={(buyer) => setState((s) => ({ ...s, buyer }))} />
      </Card>

      <Card>
        <h3 className="mb-3 text-sm font-semibold text-gray-700">③ 작성 연월일</h3>
        <div className="grid grid-cols-3 gap-3">
          <Input
            label="년"
            value={docDate.year}
            onChange={(e) => setState((s) => ({ ...s, docDate: { ...s.docDate, year: e.target.value.replace(/[^0-9]/g, "") } }))}
          />
          <Input
            label="월"
            value={docDate.month}
            onChange={(e) => setState((s) => ({ ...s, docDate: { ...s.docDate, month: e.target.value.replace(/[^0-9]/g, "") } }))}
          />
          <Input
            label="일"
            value={docDate.day}
            onChange={(e) => setState((s) => ({ ...s, docDate: { ...s.docDate, day: e.target.value.replace(/[^0-9]/g, "") } }))}
          />
        </div>
      </Card>

      <Card>
        <div className="mb-3 flex items-center justify-between">
          <h3 className="text-sm font-semibold text-gray-700">④ 품목(거래) 내역</h3>
          <Button variant="ghost" size="sm" onClick={addItem}>
            + 행 추가
          </Button>
        </div>
        <div className="space-y-3">
          {items.map((item, idx) => (
            <div key={item.id} className="rounded-xl border border-gray-200 p-3">
              <div className="mb-2 flex items-center gap-2">
                <Input value={item.month} onChange={(e) => updateItem(item.id, { month: e.target.value.replace(/[^0-9]/g, "") })} placeholder="월" className="w-16" />
                <Input value={item.day} onChange={(e) => updateItem(item.id, { day: e.target.value.replace(/[^0-9]/g, "") })} placeholder="일" className="w-16" />
                <Input value={item.name} onChange={(e) => updateItem(item.id, { name: e.target.value })} placeholder="품목명" className="flex-1" />
                <button
                  type="button"
                  aria-label="행 삭제"
                  onClick={() => removeItem(item.id)}
                  disabled={items.length <= 1}
                  className="shrink-0 rounded-lg px-2 py-2 text-gray-400 hover:bg-gray-100 hover:text-red-500 disabled:cursor-not-allowed disabled:opacity-40"
                >
                  ✕
                </button>
              </div>
              <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
                <Input value={item.spec} onChange={(e) => updateItem(item.id, { spec: e.target.value })} placeholder="규격" />
                <div>
                  <span className="mb-1 block text-xs text-gray-500">수량</span>
                  <NumberInput value={item.qty} onChange={(qty) => updateItem(item.id, { qty })} placeholder="수량" />
                </div>
                <div>
                  <span className="mb-1 block text-xs text-gray-500">단가</span>
                  <NumberInput value={item.unitPrice} onChange={(unitPrice) => updateItem(item.id, { unitPrice })} placeholder="단가" />
                </div>
                <Input value={item.note} onChange={(e) => updateItem(item.id, { note: e.target.value })} placeholder="비고" />
              </div>
            </div>
          ))}
        </div>
      </Card>

      <Card>
        <h3 className="mb-3 text-sm font-semibold text-gray-700">⑤ 결제 정보</h3>
        <div className="grid grid-cols-2 gap-3 sm:grid-cols-4">
          {[
            ["cash", "현금"],
            ["check", "수표"],
            ["note", "어음"],
            ["receivable", "외상미수금"],
          ].map(([key, label]) => (
            <div key={key}>
              <span className="mb-1 block text-xs text-gray-500">{label}</span>
              <NumberInput value={payment[key]} onChange={(v) => setState((s) => ({ ...s, payment: { ...s.payment, [key]: v } }))} placeholder="0" />
            </div>
          ))}
        </div>
        <div className="mt-4 flex items-center gap-4 text-sm text-gray-700">
          {["영수", "청구"].map((v) => (
            <label key={v} className="flex items-center gap-1.5">
              <input
                type="radio"
                name="receiptType"
                checked={payment.type === v}
                onChange={() => setState((s) => ({ ...s, payment: { ...s.payment, type: v } }))}
              />
              {v}
            </label>
          ))}
        </div>
      </Card>
    </div>
  );
}

// ========================================
// 📄 미리보기 (오른쪽, 인쇄 대상) — 전자세금계산서(홈택스) 스타일 그리드
// ========================================

function PartyRows({ label, party, rowSpan }) {
  const th = "border border-gray-700 bg-gray-50 px-1.5 py-1 text-[11px] font-medium text-gray-600 whitespace-nowrap";
  const td = "border border-gray-700 px-1.5 py-1 text-[12px] text-gray-900";
  return (
    <React.Fragment>
      <tr>
        <th
          rowSpan={rowSpan}
          className="w-6 border border-gray-700 bg-gray-50 text-center text-[12px] font-semibold text-gray-700"
          style={{ writingMode: "vertical-rl" }}
        >
          {label}
        </th>
        <th className={th}>등록번호</th>
        <td className={td} colSpan={3}>
          {party.regNo}
        </td>
      </tr>
      <tr>
        <th className={th}>상호(법인명)</th>
        <td className={td}>{party.name}</td>
        <th className={th}>성명</th>
        <td className={td}>{party.ceo}</td>
      </tr>
      <tr>
        <th className={th}>사업장주소</th>
        <td className={td} colSpan={3}>
          {party.address}
        </td>
      </tr>
      <tr>
        <th className={th}>업태</th>
        <td className={td}>{party.bizType}</td>
        <th className={th}>종목</th>
        <td className={td}>{party.bizItem}</td>
      </tr>
    </React.Fragment>
  );
}

function InvoicePreview({ state, totals, warnings }) {
  const { supplier, buyer, docDate, payment } = state;
  const th = "border border-gray-700 bg-gray-50 px-1.5 py-1 text-[11px] font-medium text-gray-600";
  const td = "border border-gray-700 px-1.5 py-1 text-[12px] text-gray-900";

  return (
    <div>
      {warnings.length > 0 && (
        <div className="no-print mb-4 rounded-lg bg-amber-50 p-3 text-sm text-amber-700">
          <div className="mb-1 font-medium">⚠ 필수 기재사항 확인이 필요합니다</div>
          {warnings.map((w, i) => (
            <div key={i}>· {w}</div>
          ))}
        </div>
      )}

      <div className="print-area border-2 border-gray-800 bg-white p-4 text-gray-900">
        <div className="mb-2 grid grid-cols-[1fr_auto_1fr] items-center">
          <div className="text-[11px] text-gray-500">(공급자 보관용)</div>
          <h2 className="whitespace-nowrap text-center text-xl font-bold tracking-[0.2em]">전자세금계산서</h2>
          <div className="text-right text-[11px] text-gray-500">승인번호&nbsp;&nbsp;-</div>
        </div>

        <table className="w-full border-collapse">
          <tbody>
            <PartyRows label="공급자" party={supplier} rowSpan={4} />
            <PartyRows label="공급받는자" party={buyer} rowSpan={4} />
            <tr>
              <th className={th}>작성일자</th>
              <td className={td} colSpan={4}>
                {docDate.year}년 {docDate.month}월 {docDate.day}일
              </td>
            </tr>
            <tr>
              <th className={th}>공급가액</th>
              <td className={td} colSpan={4}>
                {formatWon(totals.supplyTotal)}
              </td>
            </tr>
            <tr>
              <th className={th}>세액</th>
              <td className={td} colSpan={4}>
                {formatWon(totals.taxTotal)}
              </td>
            </tr>
          </tbody>
        </table>

        <div className="overflow-x-auto">
          <table className="w-full border-collapse">
            <tbody>
              <tr className="text-center text-[11px] text-gray-600">
                <th className={th}>월</th>
                <th className={th}>일</th>
                <th className={th}>품목</th>
                <th className={th}>규격</th>
                <th className={th}>수량</th>
                <th className={th}>단가</th>
                <th className={th}>공급가액</th>
                <th className={th}>세액</th>
                <th className={th}>비고</th>
              </tr>
              {totals.rows.map((r) => (
                <tr key={r.id} className="text-center">
                  <td className={td}>{r.month}</td>
                  <td className={td}>{r.day}</td>
                  <td className={`${td} text-left`}>{r.name}</td>
                  <td className={td}>{r.spec}</td>
                  <td className={td}>{r.qty || 0}</td>
                  <td className={`${td} text-right`}>{r.unitPrice ? Number(r.unitPrice).toLocaleString("ko-KR") : ""}</td>
                  <td className={`${td} text-right`}>{formatWon(r.supplyAmount)}</td>
                  <td className={`${td} text-right`}>{formatWon(r.taxAmount)}</td>
                  <td className={`${td} text-left`}>{r.note}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <table className="w-full border-collapse">
          <tbody>
            <tr className="text-center text-[11px] text-gray-600">
              <th className={th}>합계금액</th>
              <th className={th}>현금</th>
              <th className={th}>수표</th>
              <th className={th}>어음</th>
              <th className={th}>외상미수금</th>
              <th className={th}>이 금액을</th>
            </tr>
            <tr className="text-center">
              <td className={`${td} font-bold`}>{formatWon(totals.grandTotal)}</td>
              <td className={td}>{formatWon(payment.cash)}</td>
              <td className={td}>{formatWon(payment.check)}</td>
              <td className={td}>{formatWon(payment.note)}</td>
              <td className={td}>{formatWon(payment.receivable)}</td>
              <td className={`${td} font-medium`}>({payment.type}) 함</td>
            </tr>
          </tbody>
        </table>

        <p className="mt-2 text-[10px] leading-relaxed text-gray-400">
          ※ 본 서식은 학습용 계산 도구로 생성한 참고용 문서이며, 국세청 홈택스를 통해 실제 전송·승인된 전자세금계산서가 아닙니다.
        </p>
      </div>
    </div>
  );
}

// ========================================
// 🚀 App Component
// ========================================

function App() {
  const t = todayParts();

  const [state, setState] = useState({
    supplier: {
      regNo: "578-86-03974",
      name: "피이에이에프 주식회사",
      ceo: "황성재",
      address: "경기도 화성시 동탄구 동탄지성로 11, 714-에이182호 (반송동, 동탄SR GOLD PLAZA)",
      bizType: "전문, 과학 및 기술서비스업",
      bizItem: "광고 대행업",
    },
    buyer: { regNo: "", name: "", ceo: "", address: "", bizType: "", bizItem: "" },
    docDate: { year: String(t.year), month: String(t.month), day: String(t.day) },
    items: [{ id: makeId(), month: String(t.month), day: String(t.day), name: "", spec: "", qty: 1, unitPrice: "", note: "" }],
    payment: { cash: "", check: "", note: "", receivable: "", type: "청구" },
  });

  const totals = useMemo(() => {
    const rows = state.items.map((it) => {
      const supplyAmount = Number(it.qty || 0) * Number(it.unitPrice || 0);
      const taxAmount = Math.round(supplyAmount * 0.1);
      return { ...it, supplyAmount, taxAmount };
    });
    const supplyTotal = rows.reduce((s, r) => s + r.supplyAmount, 0);
    const taxTotal = rows.reduce((s, r) => s + r.taxAmount, 0);
    return { rows, supplyTotal, taxTotal, grandTotal: supplyTotal + taxTotal };
  }, [state.items]);

  const warnings = useMemo(() => {
    const w = [];
    if (!state.supplier.regNo.trim()) w.push("공급자 등록번호가 비어 있습니다.");
    if (!state.supplier.name.trim()) w.push("공급자 상호가 비어 있습니다.");
    if (!state.buyer.regNo.trim()) w.push("공급받는자 등록번호가 비어 있습니다.");
    if (!state.docDate.year || !state.docDate.month || !state.docDate.day) w.push("작성 연월일이 비어 있습니다.");
    if (totals.supplyTotal <= 0) w.push("공급가액이 0원입니다. 품목의 수량·단가를 입력해주세요.");
    return w;
  }, [state, totals]);

  const handlePrint = () => window.print();

  return (
    <div className="min-h-screen px-4 py-8 sm:px-6 lg:px-8">
      <div className="mx-auto max-w-6xl">
        <header className="no-print mb-6 text-center">
          <h1 className="text-2xl font-bold text-gray-900 sm:text-3xl">세금계산서 생성기</h1>
          <p className="mt-2 text-sm text-gray-500">전자세금계산서(홈택스) 스타일 서식</p>
        </header>

        <div className="grid grid-cols-1 gap-6 lg:grid-cols-2">
          <InvoiceForm state={state} setState={setState} />

          <div>
            <InvoicePreview state={state} totals={totals} warnings={warnings} />
            <div className="no-print mt-4 flex justify-end">
              <Button variant="primary" size="lg" onClick={handlePrint}>
                🖨 인쇄하기
              </Button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ========================================
// Rendering
// ========================================

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
