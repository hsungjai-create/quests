<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>익명 고민/칭찬 게시판</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ========================================
    // 📡 API
    // ========================================
    const API_BASE_URL = '/api';

    async function apiRequest(path, options) {
      const res = await fetch(`${API_BASE_URL}${path}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      const json = await res.json();
      if (!res.ok || !json.success) {
        throw new Error(json.message || '요청에 실패했습니다.');
      }
      return json.data;
    }

    // ========================================
    // 🛠️ Utils
    // ========================================
    const CATEGORIES = [
      { value: '고민', label: '고민', badge: 'bg-slate-200 text-slate-700', ring: 'focus:ring-slate-400' },
      { value: '칭찬', label: '칭찬', badge: 'bg-amber-100 text-amber-700', ring: 'focus:ring-amber-400' },
      { value: '응원', label: '응원', badge: 'bg-emerald-100 text-emerald-700', ring: 'focus:ring-emerald-400' },
    ];
    const MAX_CONTENT_LENGTH = 500;

    function categoryMeta(category) {
      return CATEGORIES.find((c) => c.value === category) || CATEGORIES[0];
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString('ko-KR', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
      });
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, className = '', children, type = 'button' }) {
      const base = 'inline-flex items-center justify-center font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700',
        ghost: 'bg-white text-slate-600 border border-slate-300 hover:bg-slate-50',
        ghostActive: 'bg-indigo-600 text-white border border-indigo-600',
        like: 'bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100',
      };
      const sizes = {
        sm: 'text-xs px-3 py-1.5',
        md: 'text-sm px-4 py-2',
        lg: 'text-base px-5 py-2.5',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 p-6 ${className}`}>
          {children}
        </div>
      );
    }

    // ========================================
    // 🎯 App
    // ========================================
    function App() {
      const [category, setCategory] = useState(CATEGORIES[0].value);
      const [content, setContent] = useState('');
      const [sort, setSort] = useState('latest');
      const [posts, setPosts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [submitError, setSubmitError] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [likingId, setLikingId] = useState(null);

      const loadPosts = useCallback(async (sortValue) => {
        setLoading(true);
        setError('');
        try {
          const data = await apiRequest(`/posts?sort=${sortValue}`);
          setPosts(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => {
        loadPosts(sort);
      }, [sort, loadPosts]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitError('');
        const trimmed = content.trim();
        if (!trimmed) {
          setSubmitError('내용을 입력해주세요.');
          return;
        }
        if (trimmed.length > MAX_CONTENT_LENGTH) {
          setSubmitError(`내용은 ${MAX_CONTENT_LENGTH}자 이하로 입력해주세요.`);
          return;
        }
        setSubmitting(true);
        try {
          await apiRequest('/posts', {
            method: 'POST',
            body: JSON.stringify({ category, content: trimmed }),
          });
          setContent('');
          await loadPosts(sort);
        } catch (err) {
          setSubmitError(err.message);
        } finally {
          setSubmitting(false);
        }
      };

      const handleLike = async (id) => {
        setLikingId(id);
        try {
          const updated = await apiRequest(`/posts/${id}/like`, { method: 'POST' });
          setPosts((prev) => prev.map((p) => (p.id === id ? updated : p)));
        } catch (err) {
          setError(err.message);
        } finally {
          setLikingId(null);
        }
      };

      return (
        <div className="max-w-2xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-bold text-slate-800 mb-1">💬 익명 고민/칭찬 게시판</h1>
          <p className="text-sm text-slate-500 mb-6">이름 없이 편하게 고민, 칭찬, 응원을 나눠보세요.</p>

          <Card className="mb-6">
            <form onSubmit={handleSubmit}>
              <div className="flex gap-2 mb-3">
                {CATEGORIES.map((c) => (
                  <button
                    key={c.value}
                    type="button"
                    onClick={() => setCategory(c.value)}
                    className={`px-4 py-1.5 rounded-full text-sm font-medium border transition-colors ${
                      category === c.value
                        ? 'bg-indigo-600 text-white border-indigo-600'
                        : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'
                    }`}
                  >
                    {c.label}
                  </button>
                ))}
              </div>
              <textarea
                value={content}
                onChange={(e) => setContent(e.target.value)}
                placeholder="익명으로 남기고 싶은 이야기를 적어주세요"
                rows={3}
                maxLength={MAX_CONTENT_LENGTH}
                className="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
              <div className="flex items-center justify-between mt-3">
                <span className="text-xs text-slate-400">{content.length} / {MAX_CONTENT_LENGTH}</span>
                <Button type="submit" disabled={submitting}>등록</Button>
              </div>
              {submitError && <div className="mt-2 text-sm text-rose-600">{submitError}</div>}
            </form>
          </Card>

          <div className="flex gap-2 mb-4">
            <Button
              variant={sort === 'latest' ? 'ghostActive' : 'ghost'}
              size="sm"
              onClick={() => setSort('latest')}
            >
              최신순
            </Button>
            <Button
              variant={sort === 'likes' ? 'ghostActive' : 'ghost'}
              size="sm"
              onClick={() => setSort('likes')}
            >
              공감순
            </Button>
          </div>

          {error && <div className="mb-4 text-sm text-rose-600">{error}</div>}

          {loading ? (
            <div className="text-sm text-slate-400">불러오는 중...</div>
          ) : posts.length === 0 ? (
            <Card className="text-sm text-slate-400 text-center">아직 등록된 글이 없습니다. 첫 글을 남겨보세요!</Card>
          ) : (
            <div className="space-y-3">
              {posts.map((p) => {
                const meta = categoryMeta(p.category);
                return (
                  <Card key={p.id}>
                    <div className="flex items-center justify-between mb-2">
                      <span className={`text-xs font-medium px-2.5 py-1 rounded-full ${meta.badge}`}>
                        {meta.label}
                      </span>
                      <span className="text-xs text-slate-400">{formatDate(p.created_at)}</span>
                    </div>
                    <p className="text-sm text-slate-800 whitespace-pre-wrap mb-3">{p.content}</p>
                    <Button
                      variant="like"
                      size="sm"
                      disabled={likingId === p.id}
                      onClick={() => handleLike(p.id)}
                    >
                      ❤️ 공감 {p.likes}
                    </Button>
                  </Card>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
