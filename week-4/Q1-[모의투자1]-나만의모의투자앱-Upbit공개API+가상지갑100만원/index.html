<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모의투자</title>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ========================================
    // 📡 API
    // ========================================
    const API_BASE_URL = '/api';

    async function apiRequest(path, options) {
      const res = await fetch(`${API_BASE_URL}${path}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      const json = await res.json();
      if (!res.ok || !json.success) {
        throw new Error(json.message || '요청에 실패했습니다.');
      }
      return json.data;
    }

    // ========================================
    // 🛠️ Utils
    // ========================================
    const MARKETS = [
      { value: 'KRW-BTC', label: '비트코인 (BTC)' },
      { value: 'KRW-ETH', label: '이더리움 (ETH)' },
    ];

    function formatKRW(n) {
      return Math.round(n).toLocaleString('ko-KR') + '원';
    }

    function formatQty(n) {
      return Number(n).toLocaleString('ko-KR', { maximumFractionDigits: 8 });
    }

    function formatPercent(n) {
      const pct = n * 100;
      const sign = pct > 0 ? '+' : '';
      return `${sign}${pct.toFixed(2)}%`;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      return d.toLocaleString('ko-KR', {
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
      });
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, className = '', children, type = 'button' }) {
      const base = 'inline-flex items-center justify-center font-medium rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary: 'bg-indigo-600 text-white hover:bg-indigo-700',
        buy: 'bg-rose-600 text-white hover:bg-rose-700',
        sell: 'bg-blue-600 text-white hover:bg-blue-700',
        secondary: 'bg-slate-100 text-slate-700 hover:bg-slate-200',
      };
      const sizes = {
        sm: 'text-sm px-3 py-1.5',
        md: 'text-sm px-4 py-2',
        lg: 'text-base px-5 py-2.5',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Card({ className = '', children }) {
      return (
        <div className={`bg-white rounded-2xl shadow-sm border border-slate-200 p-6 ${className}`}>
          {children}
        </div>
      );
    }

    // ========================================
    // 🎯 App
    // ========================================
    function App() {
      const [market, setMarket] = useState('KRW-BTC');
      const [price, setPrice] = useState(null);
      const [wallet, setWallet] = useState(null);
      const [orders, setOrders] = useState([]);
      const [amount, setAmount] = useState('');
      const [error, setError] = useState('');
      const [busy, setBusy] = useState(false);
      const pollRef = useRef(null);

      const loadPrice = useCallback(async (m) => {
        try {
          const data = await apiRequest(`/price?market=${encodeURIComponent(m)}`);
          setPrice(data);
        } catch (err) {
          console.error(err);
        }
      }, []);

      const loadWallet = useCallback(async (m) => {
        try {
          const data = await apiRequest(`/wallet?market=${encodeURIComponent(m)}`);
          setWallet(data);
        } catch (err) {
          console.error(err);
        }
      }, []);

      const loadOrders = useCallback(async () => {
        try {
          const data = await apiRequest('/orders');
          setOrders(data);
        } catch (err) {
          console.error(err);
        }
      }, []);

      const refreshAll = useCallback(async (m) => {
        await Promise.all([loadPrice(m), loadWallet(m), loadOrders()]);
      }, [loadPrice, loadWallet, loadOrders]);

      useEffect(() => {
        refreshAll(market);
        if (pollRef.current) clearInterval(pollRef.current);
        pollRef.current = setInterval(() => {
          loadPrice(market);
          loadWallet(market);
        }, 5000);
        return () => clearInterval(pollRef.current);
      }, [market]);

      const handleOrder = async (side) => {
        setError('');
        const qty = Number(amount);
        if (!Number.isFinite(qty) || qty <= 0) {
          setError('수량을 올바르게 입력해주세요.');
          return;
        }
        setBusy(true);
        try {
          await apiRequest('/order', {
            method: 'POST',
            body: JSON.stringify({ market, side, amount: qty }),
          });
          setAmount('');
          await refreshAll(market);
        } catch (err) {
          setError(err.message);
        } finally {
          setBusy(false);
        }
      };

      const profitRate = wallet ? wallet.profitRate : 0;
      const profitColor = profitRate > 0 ? 'text-rose-600' : profitRate < 0 ? 'text-blue-600' : 'text-slate-500';
      const heldQty = wallet ? Number(wallet.holdings[market]?.qty || 0) : 0;
      const positions = wallet ? wallet.positions : [];

      return (
        <div className="max-w-4xl mx-auto px-4 py-8">
          <h1 className="text-2xl font-bold text-slate-800 mb-6">📈 나만의 모의투자</h1>

          <Card className="mb-6">
            <div className="flex items-center justify-between flex-wrap gap-4">
              <div className="flex items-center gap-3">
                <select
                  value={market}
                  onChange={(e) => setMarket(e.target.value)}
                  className="rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                >
                  {MARKETS.map((m) => (
                    <option key={m.value} value={m.value}>{m.label}</option>
                  ))}
                </select>
                <div>
                  <div className="text-xs text-slate-400">현재가</div>
                  <div className="text-2xl font-bold text-slate-800">
                    {price ? formatKRW(price.trade_price) : '조회 중...'}
                  </div>
                </div>
              </div>
            </div>
          </Card>

          <Card className="mb-6">
            <h2 className="text-sm font-semibold text-slate-500 mb-4">내 지갑</h2>
            {wallet ? (
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div>
                  <div className="text-xs text-slate-400">보유 현금</div>
                  <div className="text-lg font-bold text-slate-800">{formatKRW(wallet.cash)}</div>
                </div>
                <div>
                  <div className="text-xs text-slate-400">보유 수량</div>
                  <div className="text-lg font-bold text-slate-800">{formatQty(heldQty)}</div>
                </div>
                <div>
                  <div className="text-xs text-slate-400">총 평가금액</div>
                  <div className="text-lg font-bold text-slate-800">{formatKRW(wallet.total)}</div>
                </div>
                <div>
                  <div className="text-xs text-slate-400">수익률</div>
                  <div className={`text-lg font-bold ${profitColor}`}>{formatPercent(profitRate)}</div>
                </div>
              </div>
            ) : (
              <div className="text-sm text-slate-400">불러오는 중...</div>
            )}
          </Card>

          <Card className="mb-6">
            <h2 className="text-sm font-semibold text-slate-500 mb-4">보유 코인 (평균매수가)</h2>
            {positions.length === 0 ? (
              <div className="text-sm text-slate-400">보유 중인 코인이 없습니다.</div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-slate-400 border-b border-slate-200">
                      <th className="py-2 pr-4">마켓</th>
                      <th className="py-2 pr-4">보유 수량</th>
                      <th className="py-2 pr-4">평균매수가</th>
                      <th className="py-2 pr-4">현재가</th>
                      <th className="py-2 pr-4">평가금액</th>
                      <th className="py-2">평가손익</th>
                    </tr>
                  </thead>
                  <tbody>
                    {positions.map((p) => {
                      const posColor = p.profit > 0 ? 'text-rose-600' : p.profit < 0 ? 'text-blue-600' : 'text-slate-500';
                      return (
                        <tr key={p.market} className="border-b border-slate-100 last:border-0">
                          <td className="py-2 pr-4 font-medium">{p.market}</td>
                          <td className="py-2 pr-4">{formatQty(p.qty)}</td>
                          <td className="py-2 pr-4">{formatKRW(p.avgPrice)}</td>
                          <td className="py-2 pr-4">{formatKRW(p.currentPrice)}</td>
                          <td className="py-2 pr-4">{formatKRW(p.evaluated)}</td>
                          <td className={`py-2 font-medium ${posColor}`}>
                            {formatKRW(p.profit)} ({formatPercent(p.profitRate)})
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </Card>

          <Card className="mb-6">
            <h2 className="text-sm font-semibold text-slate-500 mb-4">주문하기</h2>
            <div className="flex items-center gap-3 flex-wrap">
              <input
                type="number"
                min="0"
                step="any"
                value={amount}
                onChange={(e) => setAmount(e.target.value)}
                placeholder="수량 입력"
                className="w-40 rounded-lg border border-slate-300 px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
              <Button variant="buy" size="lg" disabled={busy} onClick={() => handleOrder('buy')}>매수</Button>
              <Button variant="sell" size="lg" disabled={busy} onClick={() => handleOrder('sell')}>매도</Button>
            </div>
            {error && <div className="mt-3 text-sm text-rose-600">{error}</div>}
          </Card>

          <Card>
            <h2 className="text-sm font-semibold text-slate-500 mb-4">주문 내역</h2>
            {orders.length === 0 ? (
              <div className="text-sm text-slate-400">아직 주문 내역이 없습니다.</div>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-slate-400 border-b border-slate-200">
                      <th className="py-2 pr-4">시간</th>
                      <th className="py-2 pr-4">마켓</th>
                      <th className="py-2 pr-4">구분</th>
                      <th className="py-2 pr-4">수량</th>
                      <th className="py-2 pr-4">체결가</th>
                      <th className="py-2">메모</th>
                    </tr>
                  </thead>
                  <tbody>
                    {orders.map((o) => (
                      <tr key={o.id} className="border-b border-slate-100 last:border-0">
                        <td className="py-2 pr-4 text-slate-500">{formatDate(o.created_at)}</td>
                        <td className="py-2 pr-4">{o.market}</td>
                        <td className="py-2 pr-4">
                          <span className={o.side === 'buy' ? 'text-rose-600 font-medium' : 'text-blue-600 font-medium'}>
                            {o.side === 'buy' ? '매수' : '매도'}
                          </span>
                        </td>
                        <td className="py-2 pr-4">{formatQty(o.amount)}</td>
                        <td className="py-2 pr-4">{formatKRW(o.price)}</td>
                        <td className="py-2 text-slate-500">{o.memo || '-'}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </Card>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
