<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>짤 생성기</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<!-- ⚠️ 모든 CDN은 버전을 명시적으로 고정한다. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>
<style>
  body { background: #f3f4f6; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const CANVAS_WIDTH = 700;
const PLACEHOLDER_HEIGHT = 420;

// ========================================
// 🎨 Design System Components
// ========================================

function Button({ variant = "primary", size = "md", disabled, onClick, className = "", children, type = "button" }) {
  const base = "inline-flex items-center justify-center gap-2 rounded-lg font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed";
  const variants = {
    primary: "bg-violet-600 text-white hover:bg-violet-700 focus:ring-violet-400",
    secondary: "bg-white text-gray-700 border border-gray-300 hover:bg-gray-50 focus:ring-gray-300",
    ghost: "bg-transparent text-gray-500 hover:bg-gray-100 focus:ring-gray-200",
  };
  const sizes = {
    sm: "px-3 py-1.5 text-sm",
    md: "px-4 py-2.5 text-sm",
    lg: "px-6 py-3 text-base",
  };
  return (
    <button
      type={type}
      disabled={disabled}
      onClick={onClick}
      className={`${base} ${variants[variant]} ${sizes[size]} ${className}`}
    >
      {children}
    </button>
  );
}

function Input({ label, value, onChange, placeholder, className = "" }) {
  return (
    <label className={`block ${className}`}>
      {label && <span className="mb-1 block text-sm font-medium text-gray-700">{label}</span>}
      <input
        type="text"
        value={value}
        onChange={onChange}
        placeholder={placeholder}
        maxLength={80}
        className="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-violet-300"
      />
    </label>
  );
}

function Card({ className = "", children }) {
  return (
    <div className={`rounded-2xl bg-white p-5 shadow-sm ring-1 ring-gray-100 ${className}`}>
      {children}
    </div>
  );
}

function Toggle({ checked, onChange, label }) {
  return (
    <label className="flex cursor-pointer items-center justify-between gap-3">
      <span className="text-sm font-medium text-gray-700">{label}</span>
      <button
        type="button"
        role="switch"
        aria-checked={checked}
        onClick={() => onChange(!checked)}
        className={`relative h-6 w-11 shrink-0 rounded-full transition-colors ${checked ? "bg-violet-600" : "bg-gray-300"}`}
      >
        <span
          className={`absolute top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform ${checked ? "translate-x-5" : "translate-x-0.5"}`}
        />
      </button>
    </label>
  );
}

// ========================================
// 🖼️ 캔버스 텍스트 유틸리티
// ========================================

function wrapText(ctx, text, maxWidth) {
  const paragraphs = text.split("\n");
  const lines = [];
  paragraphs.forEach((para) => {
    const words = para.split(" ").filter(Boolean);
    let current = "";
    words.forEach((word) => {
      const candidate = current ? `${current} ${word}` : word;
      if (ctx.measureText(candidate).width <= maxWidth) {
        current = candidate;
        return;
      }
      if (current) lines.push(current);
      if (ctx.measureText(word).width > maxWidth) {
        let chunk = "";
        for (const ch of word) {
          const t = chunk + ch;
          if (ctx.measureText(t).width > maxWidth && chunk) {
            lines.push(chunk);
            chunk = ch;
          } else {
            chunk = t;
          }
        }
        current = chunk;
      } else {
        current = word;
      }
    });
    if (current) lines.push(current);
  });
  return lines;
}

// ========================================
// 📄 사진 업로드 영역 + 미리보기 캔버스
// ========================================

function MemeCanvas({ imageObj, topText, bottomText, autoUpper, fontSizePct, canvasRef, onFile }) {
  const [dragOver, setDragOver] = useState(false);
  const fileInputRef = useRef(null);

  const handleDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) onFile(file);
  };

  return (
    <div
      onDragOver={(e) => {
        e.preventDefault();
        setDragOver(true);
      }}
      onDragLeave={() => setDragOver(false)}
      onDrop={handleDrop}
      onClick={() => !imageObj && fileInputRef.current && fileInputRef.current.click()}
      className={`relative flex items-center justify-center overflow-hidden rounded-xl border-2 border-dashed transition-colors ${
        dragOver ? "border-violet-400 bg-violet-50" : "border-gray-200 bg-gray-50"
      } ${!imageObj ? "cursor-pointer" : ""}`}
    >
      <canvas ref={canvasRef} className="max-w-full" />
      <input
        ref={fileInputRef}
        type="file"
        accept="image/*"
        className="hidden"
        onChange={(e) => e.target.files[0] && onFile(e.target.files[0])}
      />
    </div>
  );
}

// ========================================
// 🚀 App Component
// ========================================

function App() {
  const [imageSrc, setImageSrc] = useState(null);
  const [imageObj, setImageObj] = useState(null);
  const [topText, setTopText] = useState("");
  const [bottomText, setBottomText] = useState("");
  const [autoUpper, setAutoUpper] = useState(true);
  const [fontSizePct, setFontSizePct] = useState(9);

  const canvasRef = useRef(null);
  const fileInputRef = useRef(null);

  const handleFile = useCallback((file) => {
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = (e) => setImageSrc(e.target.result);
    reader.readAsDataURL(file);
  }, []);

  useEffect(() => {
    if (!imageSrc) {
      setImageObj(null);
      return;
    }
    const img = new Image();
    img.onload = () => setImageObj(img);
    img.src = imageSrc;
  }, [imageSrc]);

  // 캔버스 렌더링
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const width = CANVAS_WIDTH;
    const height = imageObj ? Math.round((imageObj.naturalHeight / imageObj.naturalWidth) * width) : PLACEHOLDER_HEIGHT;
    canvas.width = width;
    canvas.height = height;

    if (!imageObj) {
      ctx.fillStyle = "#f3f4f6";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#9ca3af";
      ctx.font = "20px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("📷 사진을 올리거나 여기로 드래그하세요", width / 2, height / 2);
      return;
    }

    ctx.drawImage(imageObj, 0, 0, width, height);

    const transform = (t) => (autoUpper ? t.toUpperCase() : t);
    const fontSize = Math.round(width * (fontSizePct / 100));
    const margin = width * 0.04;
    const maxTextWidth = width - margin * 2;
    const lineHeight = fontSize * 1.15;

    ctx.font = `bold ${fontSize}px Impact, "Arial Black", sans-serif`;
    ctx.textAlign = "center";
    ctx.lineJoin = "round";
    ctx.miterLimit = 2;
    ctx.lineWidth = Math.max(2, fontSize / 8);

    if (topText.trim()) {
      const lines = wrapText(ctx, transform(topText), maxTextWidth);
      ctx.textBaseline = "top";
      let y = margin;
      lines.forEach((line) => {
        ctx.strokeStyle = "black";
        ctx.strokeText(line, width / 2, y);
        ctx.fillStyle = "white";
        ctx.fillText(line, width / 2, y);
        y += lineHeight;
      });
    }

    if (bottomText.trim()) {
      const lines = wrapText(ctx, transform(bottomText), maxTextWidth);
      ctx.textBaseline = "alphabetic";
      let y = height - margin - (lines.length - 1) * lineHeight;
      lines.forEach((line) => {
        ctx.strokeStyle = "black";
        ctx.strokeText(line, width / 2, y);
        ctx.fillStyle = "white";
        ctx.fillText(line, width / 2, y);
        y += lineHeight;
      });
    }
  }, [imageObj, topText, bottomText, autoUpper, fontSizePct]);

  const handleDownload = () => {
    const canvas = canvasRef.current;
    if (!canvas || !imageObj) return;
    const url = canvas.toDataURL("image/png");
    const a = document.createElement("a");
    a.href = url;
    a.download = "meme.png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  const handleReset = () => {
    setImageSrc(null);
    setImageObj(null);
  };

  return (
    <div className="min-h-screen px-4 py-10 sm:px-6 lg:px-8">
      <div className="mx-auto max-w-5xl">
        <header className="mb-8 text-center">
          <h1 className="text-2xl font-bold text-gray-900 sm:text-3xl">짤 생성기</h1>
          <p className="mt-2 text-sm text-gray-500">사진을 올리고 위/아래 문구를 넣어 클래식 밈 스타일로 만들어보세요.</p>
        </header>

        <div className="grid grid-cols-1 gap-6 lg:grid-cols-2">
          <Card>
            <div className="space-y-4">
              <div>
                <span className="mb-1 block text-sm font-medium text-gray-700">사진</span>
                <div className="flex items-center gap-2">
                  <Button variant="secondary" size="sm" onClick={() => fileInputRef.current && fileInputRef.current.click()}>
                    사진 선택
                  </Button>
                  {imageObj && (
                    <Button variant="ghost" size="sm" onClick={handleReset}>
                      사진 지우기
                    </Button>
                  )}
                  <input
                    ref={fileInputRef}
                    type="file"
                    accept="image/*"
                    className="hidden"
                    onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])}
                  />
                </div>
              </div>

              <Input label="윗 문구" value={topText} onChange={(e) => setTopText(e.target.value)} placeholder="예: 발표 5분 전인데" />
              <Input label="아랫 문구" value={bottomText} onChange={(e) => setBottomText(e.target.value)} placeholder="예: PPT가 아직 완성 안 됐을 때" />

              <Toggle checked={autoUpper} onChange={setAutoUpper} label="자동 대문자 변환 (영문 클래식 밈 스타일)" />

              <div>
                <div className="mb-1 flex items-center justify-between text-sm font-medium text-gray-700">
                  <span>글자 크기</span>
                  <span className="text-gray-400">{fontSizePct}%</span>
                </div>
                <input
                  type="range"
                  min="4"
                  max="14"
                  value={fontSizePct}
                  onChange={(e) => setFontSizePct(Number(e.target.value))}
                  className="w-full accent-violet-600"
                />
              </div>

              <Button variant="primary" size="lg" className="w-full" onClick={handleDownload} disabled={!imageObj}>
                이미지 다운로드
              </Button>
              <p className="text-center text-xs text-gray-400">모든 처리는 브라우저 안에서만 이루어지며, 사진은 외부로 전송되지 않습니다.</p>
            </div>
          </Card>

          <div className="flex items-start justify-center">
            <MemeCanvas
              imageObj={imageObj}
              topText={topText}
              bottomText={bottomText}
              autoUpper={autoUpper}
              fontSizePct={fontSizePct}
              canvasRef={canvasRef}
              onFile={handleFile}
            />
          </div>
        </div>
      </div>
    </div>
  );
}

// ========================================
// Rendering
// ========================================

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
